
services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    env_file:
      - .env.docker
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
    ports:
      - "2181:2181"
    networks:
      - csv-pipeline-network
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:-zookeeper:2181}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      # In production we do NOT rely on auto topic creation
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: ${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-300000}
    networks:
      - csv-pipeline-network
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    env_file:
      - .env.docker
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-csv_ingestion}
    volumes:
      - mongodb-data:/data/db
    networks:
      - csv-pipeline-network
    command: mongod --wiredTigerCacheSizeGB 2
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ingestion API Service
  ingestion-api:
    build:
      context: .
      dockerfile: ingestion-api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-ingestion-api}
      KAFKA_INGESTION_TOPIC: ${KAFKA_INGESTION_TOPIC:-csv.ingestion}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-csv.ingestion.dlq}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-csv_ingestion}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5000}
      API_PORT: ${API_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - csv-pipeline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Worker Service (can scale horizontally)
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-csv-worker}
      KAFKA_INGESTION_TOPIC: ${KAFKA_INGESTION_TOPIC:-csv.ingestion}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-csv.ingestion.dlq}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-csv-ingestion-workers}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-csv_ingestion}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION:-csv_records}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      MAX_CONCURRENT_FILES: ${MAX_CONCURRENT_FILES:-5}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - csv-pipeline-network
    restart: unless-stopped
    deploy:
      replicas: 2  # Horizontal scaling example

  # DLQ Handler Service
  dlq-handler:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: node src/dlq-handler.js
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-dlq-handler}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-csv.ingestion.dlq}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-csv_ingestion}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - csv-pipeline-network
    restart: unless-stopped

networks:
  csv-pipeline-network:
    driver: bridge

volumes:
  kafka-data:
  mongodb-data:
  zookeeper-data:
  zookeeper-log:
