services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    env_file:
      - .env.docker
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
    ports:
      - "2181:2181"
    networks:
      - csv-pipeline-network
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka Broker 1
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
     - "9092:9092"
     - "29092:29092"
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:-zookeeper:2181}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: ${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-300000}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    networks:
      - csv-pipeline-network
    volumes:
      - kafka-data-1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka Broker 2
  kafka2:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
     - "9093:9093"
     - "29093:29093"
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:-zookeeper:2181}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9093,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: ${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-300000}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    networks:
      - csv-pipeline-network
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9093 --list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka Broker 3
  kafka3:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
     - "9094:9094"
     - "29094:29094"
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:-zookeeper:2181}
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9094,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: ${KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:-300000}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    networks:
      - csv-pipeline-network
    volumes:
      - kafka-data-3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9094 --list"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    env_file:
      - .env.docker
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-csv_ingestion}
    volumes:
      - mongodb-data:/data/db
    networks:
      - csv-pipeline-network
    command: mongod --wiredTigerCacheSizeGB 2
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ingestion API Service
  ingestion-api:
    build:
      context: .
      dockerfile: ingestion-api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092,kafka2:9093,kafka3:9094}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-ingestion-api}
      KAFKA_FILE_INGESTION_TOPIC: ${KAFKA_FILE_INGESTION_TOPIC:-file-ingestion}
      KAFKA_FILE_INGESTION_DLQ_TOPIC: ${KAFKA_FILE_INGESTION_DLQ_TOPIC:-file-ingestion-dlq}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-csv_ingestion}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5000}
      API_PORT: ${API_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - csv-pipeline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Validation Service (can scale horizontally)
  validation-service:
    build:
      context: .
      dockerfile: validation-service/Dockerfile
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092,kafka2:9093,kafka3:9094}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-validation-service}
      KAFKA_FILE_INGESTION_TOPIC: ${KAFKA_FILE_INGESTION_TOPIC:-file-ingestion}
      KAFKA_VALIDATED_CHUNKS_TOPIC: ${KAFKA_VALIDATED_CHUNKS_TOPIC:-validated-chunks}
      KAFKA_FILE_INGESTION_DLQ_TOPIC: ${KAFKA_FILE_INGESTION_DLQ_TOPIC:-file-ingestion-dlq}
      KAFKA_VALIDATION_CONSUMER_GROUP_ID: ${KAFKA_VALIDATION_CONSUMER_GROUP_ID:-validation-service-workers}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      VALIDATION_CHUNK_SIZE: ${VALIDATION_CHUNK_SIZE:-5000}
      VALIDATION_MAX_CONCURRENT_FILES: ${VALIDATION_MAX_CONCURRENT_FILES:-6}
      VALIDATION_POLL_INTERVAL_MS: ${VALIDATION_POLL_INTERVAL_MS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - csv-pipeline-network
    restart: unless-stopped
    deploy:
      replicas: 6  # Horizontal scaling for validation

  # DB Ingestion Service (can scale horizontally)
  db-ingestion-service:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092,kafka2:9093,kafka3:9094}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-db-ingestion-service}
      KAFKA_VALIDATED_CHUNKS_TOPIC: ${KAFKA_VALIDATED_CHUNKS_TOPIC:-validated-chunks}
      KAFKA_VALIDATED_CHUNKS_DLQ_TOPIC: ${KAFKA_VALIDATED_CHUNKS_DLQ_TOPIC:-validated-chunks-dlq}
      KAFKA_DB_INGESTION_CONSUMER_GROUP_ID: ${KAFKA_DB_INGESTION_CONSUMER_GROUP_ID:-db-ingestion-service-workers}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-csv_ingestion}
      MONGODB_VALID_RECORDS_COLLECTION: ${MONGODB_VALID_RECORDS_COLLECTION:-csv_records}
      MONGODB_ERROR_RECORDS_COLLECTION: ${MONGODB_ERROR_RECORDS_COLLECTION:-error_records}
      MONGODB_JOBS_COLLECTION: ${MONGODB_JOBS_COLLECTION:-jobs}
      DB_INGESTION_BATCH_SIZE: ${DB_INGESTION_BATCH_SIZE:-5000}
      DB_INGESTION_MAX_CONCURRENT_CHUNKS: ${DB_INGESTION_MAX_CONCURRENT_CHUNKS:-24}
      DB_INGESTION_POLL_INTERVAL_MS: ${DB_INGESTION_POLL_INTERVAL_MS:-100}
      DB_INGESTION_RETRY_COUNT: ${DB_INGESTION_RETRY_COUNT:-3}
      DB_INGESTION_RETRY_BACKOFF_MS: ${DB_INGESTION_RETRY_BACKOFF_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - csv-pipeline-network
    restart: unless-stopped
    deploy:
      replicas: 6  # Horizontal scaling for DB ingestion

  # DLQ Handler Service (for file-ingestion-dlq)
  dlq-handler-file-ingestion:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: node src/dlq-handler.js
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092,kafka2:9093,kafka3:9094}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-dlq-handler-file-ingestion}
      KAFKA_DLQ_TOPIC: ${KAFKA_FILE_INGESTION_DLQ_TOPIC:-file-ingestion-dlq}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-csv_ingestion}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - csv-pipeline-network
    restart: unless-stopped
    deploy:
      replicas: 3

  # DLQ Handler Service (for validated-chunks-dlq)
  dlq-handler-validated-chunks:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: node src/dlq-handler.js
    env_file:
      - .env.docker
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092,kafka2:9093,kafka3:9094}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-dlq-handler-validated-chunks}
      KAFKA_DLQ_TOPIC: ${KAFKA_VALIDATED_CHUNKS_DLQ_TOPIC:-validated-chunks-dlq}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-csv_ingestion}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      kafka:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - csv-pipeline-network
    restart: unless-stopped
    deploy:
      replicas: 3


networks:
  csv-pipeline-network:
    driver: bridge

volumes:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
  mongodb-data:
  zookeeper-data:
  zookeeper-log: